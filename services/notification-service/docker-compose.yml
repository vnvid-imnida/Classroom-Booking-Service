services:
  postgres:
    image: postgres:15-alpine
    container_name: notification-service-postgres
    environment:
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_password
      POSTGRES_DB: notification_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - notification-service-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: notification-service-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - notification-service-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: notification-service-kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    networks:
      - notification-service-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      SERVICE_NAME: notification-service
      SERVICE_PORT: 8084
      DATABASE_URL: postgresql://notification_user:notification_password@postgres:5432/notification_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: notification-service-group
      KAFKA_TOPICS: booking.created,booking.updated,booking.cancelled,schedule.synced,schedule.conflict
      MESSAGE_PROCESSING_TIMEOUT: 30
      MAX_RETRIES: 3
    networks:
      - notification-service-network
    restart: unless-stopped

networks:
  notification-service-network:
    driver: bridge
