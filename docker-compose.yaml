services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_password
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spbpu-booking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d booking"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - spbpu-booking-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - spbpu-booking-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    networks:
      - spbpu-booking-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: notification-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - spbpu-booking-network

  generator:
    build:
      context: ./services/message-generator
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - spbpu-booking-network
    profiles:
      - generator
    restart: "no"

  parser:
    build:
      context: ./services/parser
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SERVICE_NAME: parser
      SERVICE_PORT: 8082
      DATABASE_URL: postgresql://notification_user:notification_password@postgres:5432/booking
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379
    networks:
      - spbpu-booking-network
    restart: unless-stopped

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SERVICE_NAME: backend
      SERVICE_PORT: 8083
      DATABASE_URL: postgresql://notification_user:notification_password@postgres:5432/booking
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379
    networks:
      - spbpu-booking-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SERVICE_NAME: notification
      SERVICE_PORT: 8084
      DEBUG: "false"
      DATABASE_URL: postgresql://notification_user:notification_password@postgres:5432/booking
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: notification-group
      KAFKA_TOPICS: "booking.created,booking.updated,booking.cancelled,schedule.synced,schedule.conflict"
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      MESSAGE_PROCESSING_TIMEOUT: 30
      MAX_RETRIES: 3
    networks:
      - spbpu-booking-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  telegram:
    build:
      context: ./services/telegram-frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_started
      notification-service:
        condition: service_started
    ports:
      - "8090:8090"
    environment:
      SERVICE_NAME: telegram-frontend
      SERVICE_PORT: 8090
      BACKEND_URL: http://backend:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    networks:
      - spbpu-booking-network
    restart: unless-stopped

networks:
  spbpu-booking-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
